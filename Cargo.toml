[package]
name = "codex-speed"
version = "0.1.0"
edition = "2024"
description = "Local terminal dashboard for Codex CLI token usage and turn timing"
rust-version = "1.88"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "7.0.0"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
