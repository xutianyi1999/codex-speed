[package]
name = "codex-speed"
version = "0.1.0"
edition = "2024"
description = "Embedded web dashboard for native Codex OpenTelemetry metrics"
rust-version = "1.94"
license = "MIT"

[features]
default = ["embedded-web"]
embedded-web = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "decompression-gzip"] }
rust-embed = { version = "8.12.0", features = ["debug-embed"], optional = true }
mime_guess = { version = "2.0", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "metrics", "with-serde"] }
prost = "0.14.4"
sha2 = "0.11.0"
const-hex = "1.19.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
